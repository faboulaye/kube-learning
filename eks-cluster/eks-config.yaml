apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: fab-eks-cluster
  region: eu-central-1
  tags:
    owner: faboulaye
    bu: fab
    project: eks-cluster-project

availabilityZones:
  - eu-central-1a
  - eu-central-1b
  - eu-central-1c

iam:
  withOIDC: true

managedNodeGroups:
  - name: fab-eks-priv-ng
    instanceType: t3.small
    minSize: 3
    maxSize: 3
    privateNetworking: true
    volumeSize: 20
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: false
        certManager: yes
        ebs: false
        fsx: false
        efs: false
        albIngress: true
        xRay: false
        cloudWatch: false
    labels:
      lifecycle: ec2-autoscaler
